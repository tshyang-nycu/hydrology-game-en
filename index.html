<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Rain of Yulai | Hydrology RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Noto+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E3EBE6; --surface:#F6F9F7; --surface2:#EDF3EF; --ink:#183039; --muted:#566C73; --line:#C5D3CB;
  --water:#2B78A0; --water-soft:#BCD7E3; --ok:#2C7A57; --bad:#B0432E; --storm:#C98516; --storm-soft:#F3E2BF; --xp:#7A55B5;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1C21; --surface:#152730; --surface2:#1A2F38; --ink:#E1ECEA; --muted:#93AAB0; --line:#2A434C;
    --water:#5BB0D8; --water-soft:#1D4355; --ok:#5DC290; --bad:#E57D66; --storm:#E9B04E; --storm-soft:#3A2F1A; --xp:#B394E8; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1C21; --surface:#152730; --surface2:#1A2F38; --ink:#E1ECEA; --muted:#93AAB0; --line:#2A434C;
  --water:#5BB0D8; --water-soft:#1D4355; --ok:#5DC290; --bad:#E57D66; --storm:#E9B04E; --storm-soft:#3A2F1A; --xp:#B394E8; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.75}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.hand{font-family:"Pixelify Sans","Kaiti TC","STKaiti","DFKai-SB",serif}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:none;align-items:center;gap:12px;padding:8px 14px}
.hud.on{display:flex}
.hud .title{font-family:"Pixelify Sans",serif;font-weight:700;font-size:1.05rem}
.lv{font-family:"Pixelify Sans",serif;font-weight:700;background:var(--xp);color:#fff;border-radius:8px;padding:0 8px;white-space:nowrap}
.bar{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.bar .track{width:64px;height:9px;border-radius:5px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--xp);transition:width .4s}
.spacer{flex:1}
.pips{display:flex;gap:3px}
.pip{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.pip.ok{background:var(--ok);border-color:var(--ok)}
.clock{font-variant-numeric:tabular-nums;font-weight:700;padding:1px 10px;border-radius:999px;background:var(--surface2)}
.iconbtn.oni{width:auto;padding:0 8px;white-space:nowrap}
.pstat{margin:4px 2px 0;font-size:.85rem;color:var(--muted)}.pstat b{color:var(--ink);font-weight:500}.pstat .low{color:var(--bad);font-weight:700}
.iconbtn{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:8px;width:34px;height:30px;font-size:1rem;cursor:pointer}
@media (max-width:560px){.hud .title,.bar{display:none}.hud{gap:8px}}
main{max-width:760px;margin:0 auto;padding:16px 12px 48px}
h1,h2{font-family:"Pixelify Sans","Kaiti TC",serif;font-weight:700;line-height:1.3;margin:0 0 .4em}
h1{font-size:clamp(2rem,7vw,2.8rem)} h2{font-size:1.4rem}
p{margin:.4em 0 .9em}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.stack>*+*{margin-top:14px}
label{display:block;font-weight:500;margin-bottom:4px}
input[type=text]{width:100%;font:inherit;font-size:1.05rem;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible,canvas:focus-visible{outline:3px solid var(--water);outline-offset:2px}
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:11px 20px;font-weight:700;background:var(--water);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:6px 12px;font-size:.9rem;font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:10px}
.rules{margin:0;padding-left:1.2em} .rules li{margin:.25em 0}
.err{color:var(--bad);font-weight:500}
.hero{position:relative;padding:8px 0 4px}
.hero .rain{position:absolute;inset:0;pointer-events:none;opacity:.35;background:repeating-linear-gradient(105deg,transparent 0 18px,var(--water-soft) 18px 19px)}
.hero>*{position:relative}
/* stage */
.stage{position:relative;border-radius:12px;overflow:hidden;border:3px solid #22323b;background:#000;box-shadow:0 6px 20px rgba(0,0,0,.18)}
#cv{display:block;width:100%;height:auto;aspect-ratio:480/352;image-rendering:pixelated;touch-action:none}
.stage.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,4px)}}
.fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
.fade.on{opacity:1}
.dlg{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:rgba(14,22,30,.94);color:#f2f5f3;border:2px solid #cfd9d4;border-radius:10px;cursor:pointer;font-family:"Pixelify Sans","Kaiti TC",serif}
.dlg[hidden]{display:none}
.dlg canvas{width:56px;height:56px;flex:none;image-rendering:pixelated;border-radius:6px;border:1px solid #4a5a64}
.dlg .dtx{flex:1;min-width:0}
.dlg .nm{font-weight:700;color:#ffd77a;font-size:.95rem}
.dlg .tx{font-size:clamp(.95rem,2.8vw,1.1rem);line-height:1.6;min-height:3.2em}
.dlg .tx.narr{color:#cfe0e8;font-style:italic}
.dlg .more{position:absolute;right:12px;bottom:6px;color:#ffd77a;font-size:.8rem}
@media (prefers-reduced-motion:no-preference){.dlg .more{animation:blink 1s steps(2) infinite}}
@keyframes blink{50%{opacity:0}}
.dlg .skip{position:absolute;right:8px;top:-30px;border:1px solid #cfd9d4;background:rgba(14,22,30,.9);color:#f2f5f3;border-radius:999px;padding:2px 10px;font-size:.8rem;font-family:"Noto Sans",sans-serif}
.goal{margin:10px 2px 0;font-size:.95rem}
.goal b{color:var(--storm)}
.goal .chap{display:inline-block;font-family:"Pixelify Sans",serif;font-weight:700;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:0 8px;margin-right:8px}
.goal .encn{display:inline-block;margin-left:8px;font-size:.85rem;color:var(--muted)}
.controls{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:12px}
.keyhint{font-size:.85rem;color:var(--muted)}
.pad{display:flex;align-items:center;gap:18px}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;user-select:none;-webkit-user-select:none}
.dpad button,.abtn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;font-size:1.2rem;touch-action:none;user-select:none;-webkit-user-select:none}
.dpad button:active,.abtn:active{background:var(--water-soft)}
.abtn{width:64px;height:64px;border-radius:50%;font-weight:900;font-size:1.4rem;background:var(--storm);color:#fff;border:0}
@media (max-width:480px){.keyhint{display:none}.controls{justify-content:center}}
/* battle panel */
.bwrap{margin-top:10px}
.blog{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;min-height:2.6em;font-family:"Pixelify Sans",serif;font-size:1.05rem}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.bgrid .cmds{order:2}.bgrid .party{order:1}
.party{display:grid;gap:6px}
.pm{display:grid;grid-template-columns:auto 1fr auto;column-gap:8px;row-gap:2px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.9rem}
.pm b{grid-row:span 2;font-family:"Pixelify Sans",serif;min-width:3.5em}
.pm.active{border-color:var(--storm);box-shadow:0 0 0 2px var(--storm-soft)}
.pm.down{opacity:.5}
.pm small{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.78rem}
.mini{height:8px;border-radius:4px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.mini i{display:block;height:100%;transition:width .4s}
.mini.hp i{background:var(--ok)} .mini.mpb i{background:var(--water)}
.cmds{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
.cmds button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.cmds button small{font-weight:400;color:var(--muted);font-size:.75rem}
.cmds button:disabled{opacity:.45}
.cmds button.hl{background:var(--xp);color:#fff;border-color:var(--xp);grid-column:span 2}
.cmds button.ghost{color:var(--muted)}
.bgrid>*{min-width:0}
@media (max-width:620px){.bgrid{grid-template-columns:minmax(0,1fr);gap:8px}.bgrid .cmds{order:1}.bgrid .party{order:2;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
 .pm{grid-template-columns:minmax(0,1fr);padding:5px 8px;font-size:.8rem;row-gap:1px}.pm b{grid-row:auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pm small{font-size:.68rem;white-space:nowrap}
 .blog{font-size:.95rem;padding:6px 10px;min-height:2.4em}.bwrap{margin-top:8px}.cmds button{padding:12px 8px}}
/* modal */
.modal{position:fixed;inset:0;z-index:30;background:rgba(8,16,22,.62);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(24px + env(safe-area-inset-bottom,0px))}
.modal .panel{width:100%;max-width:640px}
.modal .panel.quick{max-width:480px}
.panel.wiggle{animation:wig .35s}
@keyframes wig{25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.qhead .tag{display:inline-block;font-size:.8rem;font-weight:700;color:#fff;background:var(--xp);border-radius:999px;padding:0 10px;margin-bottom:4px}
.speech{font-family:"Pixelify Sans",serif;font-size:1.1rem;line-height:1.8}
.task{border-left:4px solid var(--storm);padding:4px 0 4px 14px}
.tbl{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.95rem;min-width:100%}
caption{text-align:left;font-weight:500;color:var(--muted);padding-bottom:4px}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:center;white-space:nowrap}
thead th{background:var(--surface2)}
tbody th{text-align:left;background:var(--surface2);font-weight:500}
.ansrow{display:flex;gap:10px;align-items:center}
.ansrow .unit{font-weight:700;white-space:nowrap}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);line-height:1.6}
.opt[aria-pressed="true"]{border-color:var(--water);background:var(--water-soft)}
.opt.stone{border-radius:18px 18px 6px 6px;border-width:2px;border-color:#8d918d;font-family:"Pixelify Sans",serif;font-size:1.05rem}
.fb{border-radius:12px;padding:12px 16px;font-weight:500;line-height:1.7}
.fb.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.fb.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.slots{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.slot{flex:1;min-width:110px;border:2px dashed var(--line);border-radius:10px;padding:6px 10px;font-weight:700;text-align:center}
.slot small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
.slot.on{border-style:solid;border-color:var(--water);background:var(--water-soft)}
.opts.cards{grid-template-columns:1fr 1fr}
.opt.card{text-align:center;font-weight:700;position:relative}
.opt.card[data-n]:not([data-n=""])::before{content:attr(data-n);position:absolute;left:8px;top:6px;width:20px;height:20px;border-radius:50%;background:var(--water);color:#fff;font-size:.75rem;line-height:20px}
.uprev{display:flex;gap:8px;flex-wrap:wrap}.uprev img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.skills{grid-template-columns:1fr}}
.skillcard{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.skillcard b{font-family:"Pixelify Sans",serif;font-size:1.2rem;color:var(--xp)}
.skillcard small{color:var(--muted)}
.skillcard:hover{border-color:var(--xp)}
/* result & dashboard */
.score{font-family:"Pixelify Sans",serif;font-size:3.6rem;line-height:1.1;font-weight:700;color:var(--water);font-variant-numeric:tabular-nums}
.stats{display:flex;flex-wrap:wrap;gap:24px;margin:8px 0 16px}
.stats div b{display:block;font-size:1.6rem;font-family:"Pixelify Sans",serif}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.dash td,.dash th{text-align:left}
.flag{color:var(--bad);font-size:.85rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:40;max-width:90vw;text-align:center}
</style>
</head>
<body>
<header class="hud" id="hud">
  <span class="title">The Rain of Yulai</span>
  <span class="lv" id="lv">Lv 1</span>
  <span class="bar">EXP<span class="track"><span class="fill" id="xpf" style="width:0"></span></span></span>
  <span class="spacer"></span>
  <span class="pips" id="pips" aria-label="Hydrology challenges solved"></span>
  <button class="iconbtn oni" id="oni" aria-label="Use a rice ball">🍙 <span id="onin">0</span></button>
  <span class="clock" id="clock" title="Timer">0:00</span>
  <button class="iconbtn" id="mute" aria-label="Mute">🔊</button>
</header>
<main id="app"><p class="muted">Loading…</p></main>
<script>
const VERSION='hydro-rpg-v3';   // 改動此字串會讓所有題目數據重新產生
/* ===== 亂數（以學生 id 為種子，每人數據不同但固定） ===== */
function rngFrom(str){
  let h=1779033703^str.length;
  for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=(h<<13)|(h>>>19);}
  h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);let a=(h^=h>>>16)>>>0;
  return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};
}
/* ===== 計分題 ===== */
const QORDER=['q0','q1','q2','q3','q4','q5','q6','q7','q8'];
const PHI_NPCS=['yun','scholar','woodman','merchant'],UH_NPCS=['oldkeeper','student','hutowner','hiker'];
const PHI_STEPS=['List the rainfall intensity for each time period','Subtract φ from each period’s rainfall intensity; periods below φ count as 0','Multiply each period’s result by the period length and add them up'];
const PHI_WRONG='Divide the total rainfall by the number of hours it rained — that’s the effective rainfall';
const UH_STEPS=['Add up the discharges of the direct runoff hydrograph at every time step','Multiply the sum by the time interval and divide by the watershed area to get the direct runoff depth','Divide the discharge at each time step of the direct runoff hydrograph by the runoff depth (cm)'];
const UH_WRONG='Simply divide the direct runoff discharges by the rainfall duration';
function genQuestions(seed){
  const r=rngFrom(VERSION+':'+seed);
  const ri=(a,b)=>a+Math.floor(r()*(b-a+1));
  const step=(a,b,s)=>+(a+s*ri(0,Math.round((b-a)/s))).toFixed(2);
  const shuffle=arr=>{const x=arr.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;};
  const Q={};
  { const o=shuffle(['Carbon dioxide (CO₂)','Oxygen (O₂)','Nitrogen (N₂)','Argon (Ar)']);
    Q.q0={id:'q0',type:'mc',title:'Lin’s Test',prompt:'Which of the following is a greenhouse gas?',options:o,correct:o.indexOf('Carbon dioxide (CO₂)')}; }
  { const ids=shuffle(PHI_NPCS);const lines={};PHI_STEPS.forEach((t,k)=>lines[ids[k]]=t);lines[ids[3]]=PHI_WRONG;
    Q.q1={id:'q1',type:'order',title:'Rain Gauge: Steps of the φ-Index Method',prompt:'To find this storm’s total effective rainfall depth with the φ-index method, what is the correct order of steps? Tap the people who told you each step, in order. (Careful: one of them described a wrong method.)',cards:shuffle(PHI_NPCS),correct:ids.slice(0,3),lines}; }
  { const CN=ri(60,88),P=ri(80,180),area=ri(15,60)/10,slope=ri(3,15); const S=25400/CN-254,Ia=0.2*S;
    Q.q2={id:'q2',type:'num',title:'Cracked Farmland',prompt:'Use the SCS curve number method to estimate the direct runoff depth on Mei’s farmland (use Iₐ = 0.2S). You’ll need to ask people nearby for the data.',
      unit:'mm',answer:(P-Ia)**2/(P+0.8*S),tol:0.02,params:{CN,P,area,slope}}; }
  { const ids=shuffle(UH_NPCS);const lines={};UH_STEPS.forEach((t,k)=>lines[ids[k]]=t);lines[ids[3]]=UH_WRONG;
    Q.q3={id:'q3',type:'order',title:'Mochuan’s Notebook: Steps to Derive a Unit Hydrograph',prompt:'The notebook records a direct runoff hydrograph produced by a 1-hour effective rainfall (baseflow removed). What is the correct order of steps to derive the 1-cm unit hydrograph from it? Tap the people who told you each step, in order. (Careful: one of them described a wrong method.)',cards:shuffle(UH_NPCS),correct:ids.slice(0,3),lines}; }
  { const pk=ri(40,100); const f=[0,0.35+0.1*r(),0.8+0.1*r(),1,0.5+0.1*r(),0.2+0.1*r(),0];
    const U=f.map(v=>Math.round(pk*v)); const k=ri(2,4);
    Q.q4={id:'q4',type:'num',title:'The Soot Demon’s Barrier',prompt:`The barrier is formed by two consecutive 1-hour rain clouds overlapping. Given this watershed’s 1-hour, 1-cm unit hydrograph below, derive the discharge of the 2-hour, 1-cm unit hydrograph at hour ${k} to find the barrier’s weak point.`,
      tables:[{head:['Time (hr)',...U.map((_,t)=>t)],rows:[['1-hr UH (m³/s)',...U]]}],unit:'m³/s',answer:(U[k]+U[k-1])/2,tol:0.02}; }
  { const C=step(0.4,0.85,0.05),i=ri(8,24)*5,A=ri(5,40)/10,tot=ri(120,240),dur=ri(2,5);
    Q.q5={id:'q5',type:'num',title:'Ancient Drainage Channel',prompt:'Use the rational method to calculate the design peak discharge of the ancient drainage channel. You’ll need to ask people in the ruins for the data.',
      unit:'m³/s',answer:C*i*A/3.6,tol:0.02,params:{C,i,A,tot,dur}}; }
  { const yes=shuffle(['Effective rainfall has uniform intensity over its duration','Effective rainfall is uniformly distributed over the whole watershed','Direct runoff ordinates are proportional to the effective rainfall depth','Effective rainfall of the same duration produces the same hydrograph shape whenever it occurs','Direct runoff hydrographs from effective rainfall of the same duration have the same base time']).slice(0,3);
    const no=shuffle(['The base time lengthens as effective rainfall intensity increases','The unit hydrograph includes baseflow','Effective rainfall depth equals total rainfall depth','The unit hydrograph only applies to watersheds larger than 10,000 km²']).slice(0,3);
    const o=shuffle([...yes,...no]);
    Q.q6={id:'q6',type:'multi',title:'Ancient Steles',prompt:'Six steles bear statements about unit hydrograph theory. Select ALL the steles that state basic assumptions of the unit hydrograph.',options:o,correct:yes.map(x=>o.indexOf(x)).sort((a,b)=>a-b)}; }
  { const yes=shuffle(['Peak discharge increases','The peak arrives earlier','Dry-season baseflow decreases','Infiltration decreases and surface runoff increases']).slice(0,3);
    const no=shuffle(['Total direct runoff decreases','Infiltration increases and groundwater recharge rises','The peak arrives later','The hydrograph becomes flatter with a longer base time']).slice(0,3);
    const o=shuffle([...yes,...no]);
    Q.q7={id:'q7',type:'multi',title:'The Forest Seal',prompt:'The seal stone reads: “After the forest is cut down and the land is developed, how does the watershed change?” Select ALL correct statements.',options:o,correct:yes.map(x=>o.indexOf(x)).sort((a,b)=>a-b)}; }

/* 計分題：答對才能前進，可無限重答 */
function ask(qid,opt={}){
 return new Promise(res=>{
  const q=qs[qid]; let picked=q.type==='multi'?new Set():q.type==='order'?[]:null;
  const input=q.type==='order'?`<div class="slots" id="oslots"></div><div class="opts cards">${q.cards.map(id=>`<button class="opt card" data-id="${id}" aria-pressed="false">${NAMES[id]}</button>`).join('')}</div><button class="btn ghost small" id="oreset" type="button">Clear</button>`
   :q.type==='num'?`<label for="ans">Your answer</label><div class="ansrow"><input type="text" id="ans" inputmode="decimal" autocomplete="off"><span class="unit">${q.unit}</span></div>`
   :`<div class="opts">${q.options.map((o,k)=>`<button class="opt${opt.stone?' stone':''}" data-k="${k}" aria-pressed="false">${q.type==='multi'?'☐ ':String.fromCharCode(65+k)+'. '}${o}</button>`).join('')}</div>`;
  const m=openModal(`<div class="qhead"><span class="tag">${opt.tag||'Challenge'}</span><h2>${opt.title||q.title}</h2></div>
   <div class="task"><p style="margin:0">${q.prompt}</p></div>${(q.tables||[]).map(tableHTML).join('')}
   ${isOwner?ownerHint(q):''}<div>${input}</div><div id="qfb" aria-live="polite"></div>
   <div class="row"><button class="btn" id="qsub">${opt.submit||'Submit'}</button>${opt.closable!==false?'<button class="btn ghost" id="qclose">Leave for now</button>':''}</div>`);
  const fb=m.querySelector('#qfb');
  const drawSlots=()=>{const el=m.querySelector('#oslots');if(!el)return;el.innerHTML=q.correct.map((_,i)=>`<span class="slot${picked[i]?' on':''}"><small>Step ${i+1}</small>${picked[i]?NAMES[picked[i]]:'—'}</span>`).join('');m.querySelectorAll('.card').forEach(b=>{const k=picked.indexOf(b.dataset.id);b.setAttribute('aria-pressed',k>=0);b.dataset.n=k>=0?k+1:'';});};
  if(q.type==='order'){drawSlots();m.querySelectorAll('.card').forEach(b=>b.onclick=()=>{SND.sfx('sel');const id=b.dataset.id;const k=picked.indexOf(id);if(k>=0)picked.splice(k,1);else if(picked.length<q.correct.length)picked.push(id);drawSlots();});m.querySelector('#oreset').onclick=()=>{picked.length=0;drawSlots();};}
  const fill=m.querySelector('#tfill');if(fill)fill.onclick=()=>{if(q.type==='order'){picked.length=0;q.correct.forEach(id=>picked.push(id));drawSlots();}else if(q.type==='num'){m.querySelector('#ans').value=+q.answer.toFixed(3);}else if(q.type==='mc'){m.querySelectorAll('.opt')[q.correct].click();}else{m.querySelectorAll('.opt').forEach((b,k)=>{if(q.correct.includes(k)!==picked.has(k))b.click();});}};
  if(q.type!=='num'&&q.type!=='order')m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{SND.sfx('sel');const k=+b.dataset.k;
   if(q.type==='multi'){picked.has(k)?picked.delete(k):picked.add(k);b.setAttribute('aria-pressed',picked.has(k));b.firstChild.textContent=b.textContent.replace(/^[☐☑] /,picked.has(k)?'☑ ':'☐ ');}
   else{picked=k;m.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',x===b));}});
  else if(q.type==='num'){const a=m.querySelector('#ans');setTimeout(()=>a.focus(),50);a.onkeydown=e=>{if(e.key==='Enter')m.querySelector('#qsub').click();};}
  const cl=m.querySelector('#qclose');if(cl)cl.onclick=()=>{closeModal();res(false);};
  m.querySelector('#qsub').onclick=async()=>{
   let v;
   if(q.type==='num'){const raw=m.querySelector('#ans').value.trim().replace(/,/g,'');v=Number(raw);if(raw===''||!isFinite(v)){fb.innerHTML='<p class="err">Please enter a number (no units).</p>';return;}}
   else if(q.type==='order'){if(picked.length<q.correct.length){fb.innerHTML=`<p class="err">Pick ${q.correct.length} people in order.</p>`;return;}v=picked.slice();}
   else if(q.type==='multi'){if(!picked.size){fb.innerHTML='<p class="err">Please select at least one.</p>';return;}v=[...picked].sort((a,b)=>a-b);}
   else{if(picked===null){fb.innerHTML='<p class="err">Please choose an option first.</p>';return;}v=picked;}
   state.attempts=state.attempts||{};state.attempts[qid]=(state.attempts[qid]||0)+1;
   const ok=grade(q,v);
   if(ok){state.solved=state.solved||{};state.solved[qid]=v;state.solvedAt=state.solvedAt||{};state.solvedAt[qid]=Date.now()-state.startedAt;
    save({attempts:{[qid]:state.attempts[qid]},solved:{[qid]:v},solvedAt:{[qid]:state.solvedAt[qid]}});const rw=ONI_REWARD[qid]||0;if(rw){G.items.onigiri=(G.items.onigiri||0)+rw;}updateHud();saveGame();
    SND.sfx('ok');fb.innerHTML=`<div class="fb ok">${opt.okText||'Correct!'}${rw?`<br>🍙 Got ${rw} rice ball${rw>1?'s':''}`:''}</div>`;m.querySelectorAll('button,input').forEach(x=>x.disabled=true);
    await sleep(900);closeModal();res(true);}
   else if(opt.onWrong){save({attempts:{[qid]:state.attempts[qid]}});SND.sfx('no');const msg=opt.onWrong(v);fb.innerHTML=`<div class="fb bad">${msg} (Attempts: ${state.attempts[qid]})</div>`;m.querySelectorAll('button,input').forEach(x=>x.disabled=true);await sleep(2200);closeModal();res(false);}
   else{save({attempts:{[qid]:state.attempts[qid]}});SND.sfx('no');fb.innerHTML=`<div class="fb bad">${opt.noText||'Not quite. Think it over and try again.'} (Attempts: ${state.attempts[qid]})</div>`;
    const pn=m.querySelector('.panel');pn.classList.remove('wiggle');void pn.offsetWidth;pn.classList.add('wiggle');}
  };
 });
}
function ownerHint(q){
 const L=k=>String.fromCharCode(65+k);
 const a=q.type==='order'?q.correct.map(id=>NAMES[id]).join(' → '):q.type==='num'?`${+q.answer.toFixed(3)} ${q.unit} (±2% accepted)`:q.type==='mc'?`${L(q.correct)}. ${q.options[q.correct]}`:q.correct.map(k=>q.options[k]).join('; ');
 return `<div class="fb ok" style="font-size:.9rem">Teacher hint (only you can see this): ${a} <button class="btn small" id="tfill" type="button">Fill in answer</button></div>`;
}

function miniQuiz(){
 return new Promise(res=>{
  const item=QUIZ[Math.floor(Math.random()*QUIZ.length)]; const opts=item.slice(1).map((o,i)=>({o,ok:i===0})).sort(()=>Math.random()-.5);
  const m=openModal(`<div class="qhead"><span class="tag">Critical chance</span><h2>Flash of insight!</h2></div><p class="speech">${item[0]}</p>
   <div class="opts">${opts.map((x,k)=>`<button class="opt" data-k="${k}">${x.o}</button>`).join('')}</div><div id="mfb"></div>`,'quick');
  m.querySelectorAll('.opt').forEach(b=>b.onclick=async()=>{const ok=opts[+b.dataset.k].ok;m.querySelectorAll('.opt').forEach(x=>x.disabled=true);
   m.querySelector('#mfb').innerHTML=`<div class="fb ${ok?'ok':'bad'}">${ok?'Correct! Your attack will be a critical hit!':'Not quite. The answer is “'+item[1]+'”.'}</div>`;SND.sfx(ok?'ok':'no');
   await sleep(ok?700:1300);closeModal();res(ok);});
 });
}
function chooseSkill(id,pair){

async function battleOnce(o){
 ensureParty();SND.sfx('enc');G.mode='battle';
 if(!REDUCE){for(let k=0;k<3;k++){G.flash=.8;await sleep(90);}}
 await fadeOut();
 const lv=levelOf(G.xp);
 BT={boss:o.boss||null,foes:o.foes.map((k,i)=>({...FOES[k],key:k,max:FOES[k].hp,stun:0,i,hit:0})),fx:[],txt:[],theme:MAPS[G.map].theme,
  ps:members().map(id=>({id,...baseStats(id,lv),cur:G.party[id],guard:0,atkup:0,crit:false,def0:false,act:0})),barrier:!!o.boss&&!solved(FOES[o.boss].q),turn:0};
 if(BT.boss){BT.foes[0].hp=BT.foes[0].max;}
 G.scene='battle';SND.play(BT.boss?'boss':'battle');showControls(false);bpanel();
 await fadeIn();
 if(o.intro)await talk(o.intro);
 if(BT.boss&&solved(FOES[BT.boss].q)&&typeof uploadWork==='function'&&!(state.uploads&&state.uploads[FOES[BT.boss].q]))await uploadWork(FOES[BT.boss].q);
 if(o.retry)await blog('Try again!',900);
 let lost=false;
 while(true){
  for(const p of BT.ps){
   if(p.cur.hp<=0)continue; if(BT.foes.every(f=>f.hp<=0))break;
   if(p.stunned){p.stunned=0;BT.active=p;drawParty();await blog(`${nameOf(p.id)} is stuck in the mud and can’t act this turn!`,1000);BT.active=null;continue;}
   const a=await chooseCmd(p); await doAct(p,a); if(BT.foes.every(f=>f.hp<=0))break;
  }

  for(const f of BT.foes){ if(f.hp<=0)continue; if(f.stun){f.stun=0;await blog(`${f.n} is held back by the Check Dam and can’t act!`,800);continue;} await foeAct(f); }

  if(BT.blind)BT.blind--;BT.foes.forEach(f=>{if(f.pow)f.pow--;});
  if(BT.ps.every(p=>p.cur.hp<=0)){lost=true;break;}
 }
 if(lost){
  SND.sfx('no');await blog('The whole party has fallen…',1400);

  G.scene='world';BT=null;showControls(true);SND.play(songFor());updateGoal();await fadeIn();G.mode='busy';
  await talk([['narr','The whole party has fallen… You retreat to a safe spot to catch your breath.'],G.f.lin?['lin','Everyone has recovered half their strength. Let’s regroup and try again!']:['hero','…I’ve got some strength back. One more try!'],['narr',`Challenge again: ${o.boss?FOES[o.boss].n:'the same enemies'}`]]);
  saveGame();return 'lose';
 }
 const xp=BT.foes.reduce((s,f)=>s+f.xp,0);
 SND.play('win');await blog(BT.boss?`${BT.foes[0].n} has been defeated!`:`Victory! Gained ${xp} EXP.`,1500);
 const lvBefore=levelOf(G.xp);G.xp+=xp;const lvAfter=levelOf(G.xp);
 BT.ps.forEach(p=>{if(p.cur.hp<=0)p.cur.hp=1;p.cur.mp=p.mp;});
 if(lvAfter>lvBefore){SND.sfx('lvl');await blog(`Level up! The party is now Lv ${lvAfter}. Max HP increased and MP fully restored.`,1500);
  for(let L=lvBefore+1;L<=lvAfter;L++)for(const id of members()){const pr=PICKS[id]&&PICKS[id][L];if(pr)await chooseSkill(id,pr);}
  members().forEach(id=>{const s0=baseStats(id,lvBefore),s=baseStats(id,lvAfter),c=G.party[id];c.hp=Math.min(s.hp,c.hp+(s.hp-s0.hp));c.mp=s.mp;});}

function deepMerge(a,b){for(const k in b){const v=b[k];if(v&&typeof v==='object'&&!Array.isArray(v)){if(!a[k]||typeof a[k]!=='object'||Array.isArray(a[k]))a[k]={};deepMerge(a[k],v);}else a[k]=v;}return a;}

 const send=()=>{const body={sid:state.sid,name:state.name,chapter:state.chapter||'',finished:!!state.finished,clientStart:state.startedAt,attempts:state.attempts||{},solvedAt:state.solvedAt||{},version:VERSION};
  fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).catch(()=>{});};
 clearTimeout(sendTimer); if(now)send(); else sendTimer=setTimeout(send,1500);
}

function compressImg(file){return new Promise((ok,bad)=>{const img=new Image(),url=URL.createObjectURL(file);
 img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',.82).split(',')[1]);};
 img.onerror=()=>bad(new Error('Couldn’t read this image'));img.src=url;});}
async function postUpload(body){
 try{const r=await fetch(SHEET_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});const t=await r.text();if(!/^ok/.test(t))throw new Error(t||'No response from server');return true;}
 catch(e){if(e instanceof TypeError&&navigator.onLine)return true;throw e;}
}
function uploadWork(qid){
 return new Promise(res=>{
  state.uploads=state.uploads||{};
  if(!SHEET_URL){state.uploads[qid]='skip';persist();toast('Test version: skipping work upload');return res();}
  const m=openModal(`<div class="qhead"><span class="tag">Upload your work</span><h2>Photograph your handwritten calculations</h2></div>
   <p>Write out your full calculation for this question on paper, then take a photo and upload it to continue the battle. You can upload 1–3 photos.</p>
   <label class="btn ghost" style="cursor:pointer">Choose or take photos<input type="file" id="ufile" accept="image/*" multiple hidden></label>
   <div class="uprev" id="uprev"></div><div id="ufb" aria-live="polite"></div>
   <div class="row"><button class="btn" id="usend" disabled>Upload</button></div>`);
  let files=[];const fb=m.querySelector('#ufb'),send=m.querySelector('#usend');
  m.querySelector('#ufile').onchange=e=>{files=[...e.target.files].slice(0,3);m.querySelector('#uprev').innerHTML=files.map(f=>`<img src="${URL.createObjectURL(f)}" alt="Photo of calculations">`).join('');send.disabled=!files.length;fb.innerHTML='';};
  send.onclick=async()=>{
   send.disabled=true;
   try{for(let i=0;i<files.length;i++){fb.innerHTML=`<p class="muted">Uploading (${i+1}/${files.length})…</p>`;const data=await compressImg(files[i]);
     await postUpload({type:'upload',sid:state.sid,name:state.name,qid,idx:i+1,mime:'image/jpeg',data});}
    state.uploads[qid]=true;persist();report(true);SND.sfx('ok');fb.innerHTML='<div class="fb ok">Upload complete!</div>';await sleep(900);closeModal();res();}
   catch(err){fb.innerHTML=`<p class="err">Upload failed: ${esc(err.message||err)}. Check your connection and try again.</p>`;send.disabled=false;}
  };
 });
}
function boot(){
 document.getElementById('mute').onclick=()=>{SND.init();SND.setMuted(!SND.muted);document.getElementById('mute').textContent=SND.muted?'🔇':'🔊';document.getElementById('mute').setAttribute('aria-label',SND.muted?'Unmute':'Mute');};
 const unlock=()=>{SND.init();removeEventListener('pointerdown',unlock);removeEventListener('keydown',unlock);};addEventListener('pointerdown',unlock);addEventListener('keydown',unlock);
 renderRegister();
}
function renderRegister(){
 hud.classList.remove('on');
 app.innerHTML=`<div class="stack">
  <div class="hero"><div class="rain"></div><h1>The Rain of Yulai</h1>
   <p class="hand" style="font-size:1.2rem">It hasn’t rained in Yulai Village for months. As a newly appointed hydraulic engineer, you must uncover why the climate has gone wrong and bring the rain back to this land.</p></div>
  ${isOwner?'<div class="panel"><b>Teacher mode</b>: answer hints and objectives are shown, and records can be cleared.</div>':''}
  <div class="panel stack"><h2>Before you begin</h2><ul class="rules">
   <li>Move with the arrow keys or WASD. Press Space or Enter to talk and inspect. On a phone, use the on-screen buttons.</li>
   <li>Your score is <b>not</b> based on completion time, but your time is still recorded. The timer starts when you press “Start” and cannot be paused. If you close the page, reopen it on the same device and browser and enter the same student ID to continue from your save — the timer keeps running.</li>
   <li>You must <b>answer the hydrology questions correctly to move on</b>, and you can retry as many times as you need. Every student gets different numbers (based on student ID). Calculators are allowed. Numerical answers within 2% of the correct value count as correct.</li>
   <li>Bosses are protected by barriers that block attacks. Use “Decode Barrier” and answer correctly to defeat them.</li>
   <li>You’ll meet monsters in the wild. Defeating them levels you up and teaches new skills. Ungraded mini-quizzes sometimes pop up in battle — answer correctly for a critical hit.</li>
   <li>Pay attention to every clue — anything an NPC says along the way could be a clue.</li>
   <li>HP does not recover after battles. Solve certain puzzles to earn 🍙 rice balls, which restore HP.</li>
   <li>For the final boss battle, you must upload your handwritten calculations to finish the game. Don’t forget!</li>
   <li>The game has music and sound effects. Use the speaker button at the top right to mute.</li>
   ${SHEET_URL?'':'<li class="err">Test version: scores are not sent to the teacher.</li>'}</ul></div>
  <div class="panel stack">
   <div><label for="sid">Student ID</label><input type="text" id="sid" autocomplete="off" maxlength="20"></div>
   <div><label for="sname">Name (also your name in the game)</label><input type="text" id="sname" autocomplete="name" maxlength="16"></div>
   <p class="err" id="regerr" hidden></p><button class="btn" id="go">Start</button></div></div>`;
 document.getElementById('go').onclick=()=>{
  SND.init();
  const sid=document.getElementById('sid').value.trim(),name=document.getElementById('sname').value.trim(),er=document.getElementById('regerr');
  if(!sid||!name){er.textContent='Please enter your student ID and name.';er.hidden=false;return;}
  if(!/^[A-Za-z0-9_-]{2,20}$/.test(sid)){er.textContent='Student ID may only contain letters and numbers.';er.hidden=false;return;}
  uid='sid_'+sid.toUpperCase();qs=genQuestions(uid);finishing=false;
  let saved=null;try{saved=JSON.parse(localStorage.getItem(KEY(sid.toUpperCase()))||'null');}catch(e){}
  if(saved){state=saved;['attempts','solved','solvedAt'].forEach(k=>state[k]=state[k]||{});
   if(state.finished)return renderResult();toast('Save found. Continuing your adventure.');return startGame(false);}
  state={sid:sid.toUpperCase(),name,startedAt:Date.now(),finished:false,version:VERSION,attempts:{},solved:{},solvedAt:{},chapter:'Ch. 1 The Parched Village'};
  persist();report(true);startGame(true);
 };
}
function startGame(isNew){
 hud.classList.add('on');buildStage();startClock();
 const sv=state.save;
 Object.assign(G,{scene:'world',mode:'idle',map:'village',x:10,y:14,dir:'up',f:{},xp:0,sk:{hero:[],lin:['l_rain'],mo:['m_channel']},steps:{},enc:{},party:{},items:{onigiri:2},weather:null,moving:null,flash:0});
 if(sv)Object.assign(G,{map:sv.map,x:sv.x,y:sv.y,dir:sv.dir||'down',f:sv.f||{},xp:sv.xp||0,sk:sv.sk||G.sk,steps:sv.steps||{},enc:sv.enc||{},party:sv.party||{},items:sv.items||{onigiri:2}});
 ['hero','lin','mo'].forEach(k=>{if(!G.sk[k])G.sk[k]=k==='lin'?['l_rain']:k==='mo'?['m_channel']:[];});
 document.getElementById('oni').onclick=()=>useOnigiriMap();
 G.fx=G.x;G.fy=G.y;G.trail=[0,1,2].map(()=>({x:G.x,y:G.y,dir:G.dir}));G.prevTrail=[];
 if(G.f.restored)G.weather='rain';
 ENTS=entsFor(G.map);ensureParty();updateHud();updateGoal();SND.play(songFor());
 G.mode='map';
 if(isNew){saveGame();runEvent(introScene);}else runEvent(()=>talk([['narr','Save loaded. Continue your journey! (The timer is still running.)']]));
}
async function finish(){
 if(finishing)return;finishing=true;clearInterval(timerId);
 const fin=Date.now(),totalMs=fin-state.startedAt;Object.assign(state,{finished:true,finishedAt:fin,totalMs,chapter:'Cleared'});
 await save({finished:true,finishedAt:fin,totalMs,chapter:'Cleared'});
 SND.play('ending');renderResult();
}
function renderResult(){
 clearInterval(timerId);hud.classList.remove('on');closeModal();window.scrollTo(0,0);G.scene='none';
 const total=state.totalMs||(state.finishedAt-state.startedAt);
 app.innerHTML=`<div class="stack">
  <div class="hero"><div class="rain"></div><h1>The rain has returned to Yulai</h1><p class="hand" style="font-size:1.15rem">Congratulations! ${esc(state.name)}, Lin, and Mochuan have protected this land.</p></div>
  <div class="panel stack"><div><div class="muted">Completion time</div><div class="score">${fmtMs(total)}</div></div>
   <div class="tbl"><table><thead><tr><th>Challenge</th><th>Attempts</th><th>Solved at</th></tr></thead><tbody>
   ${QORDER.map(q=>`<tr><th scope="row">${QTITLE[q]}</th><td>${state.attempts&&state.attempts[q]||'—'}</td><td>${state.solvedAt&&state.solvedAt[q]!=null?fmtMs(state.solvedAt[q]):'—'}</td></tr>`).join('')}
   </tbody></table></div>
   <p class="muted">${esc(state.sid)} ${esc(state.name)}: ${SHEET_URL?'Your record has been sent to your teacher. No screenshot needed.':'This is a test version. Your score was not sent.'}</p>
   ${(ALLOW_RESET||isOwner)?'<button class="btn ghost" id="again">Clear this record and start over</button>':''}
   <button class="btn ghost" id="home">Back to start</button></div></div>`;
 const ag=document.getElementById('again');if(ag)ag.onclick=()=>{try{localStorage.removeItem(KEY(state.sid));}catch(e){}state=null;toast('Record cleared');renderRegister();};
 document.getElementById('home').onclick=()=>{state=null;renderRegister();};
}
function confirmBox(msg){return new Promise(res=>{const m=openModal(`<h2>Confirm</h2><p>${msg}</p><div class="row"><button class="btn" id="cyes">OK</button><button class="btn ghost" id="cno">Cancel</button></div>`,'quick');
 m.querySelector('#cyes').onclick=()=>{closeModal();res(true);};m.querySelector('#cno').onclick=()=>{closeModal();res(false);};});}
addEventListener('error',e=>toast('Something went wrong: '+(e.message||'unknown error')+'. Please take a screenshot for your teacher, then reload to continue from your save.',6000));
boot();
</script>
</body>
</html>
